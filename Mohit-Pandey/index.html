<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-Bit Terminal Login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="crt-screen">
        <div class="scan-lines"></div>
        <div class="terminal-container">
            <header class="terminal-header">
                <h1 class="system-title">SYSTEM TERMINAL v2.1.3</h1>
                <div class="status-indicators">
                    <span class="status-dot online"></span>
                    <span class="status-text">ONLINE</span>
                </div>
            </header>
            
            <main class="terminal-body">
                <div class="login-prompt">
                    <div class="prompt-line">
                        <span class="prompt-text">user@terminal:~$ </span>
                        <span class="cursor-blink">█</span>
                    </div>
                </div>
                
                <form class="login-form" id="loginForm" novalidate>
                    <div class="form-field">
                        <label for="username" class="field-label">USERNAME:</label>
                        <div class="input-container">
                            <input 
                                type="text" 
                                id="username" 
                                name="username" 
                                class="terminal-input"
                                placeholder="Enter username..."
                                autocomplete="username"
                                required
                                aria-describedby="username-error"
                            >
                            <div class="input-border"></div>
                        </div>
                        <div id="username-error" class="error-message" aria-live="polite"></div>
                    </div>
                    
                    <div class="form-field">
                        <label for="password" class="field-label">PASSWORD:</label>
                        <div class="input-container">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                class="terminal-input"
                                placeholder="Enter password..."
                                autocomplete="current-password"
                                required
                                aria-describedby="password-error"
                            >
                            <div class="input-border"></div>
                        </div>
                        <div id="password-error" class="error-message" aria-live="polite"></div>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="terminal-button primary">
                            <span class="button-text">ACCESS TERMINAL</span>
                            <div class="button-border"></div>
                        </button>
                        <button type="button" class="terminal-button secondary" id="clearButton">
                            <span class="button-text">CLEAR</span>
                            <div class="button-border"></div>
                        </button>
                    </div>
                </form>
                
                <div class="success-message" id="successMessage" aria-live="polite">
                    <div class="success-content">
                        <div class="success-icon">✓</div>
                        <div class="success-text">ACCESS GRANTED</div>
                        <div class="success-subtext">Welcome to the system, user.</div>
                    </div>
                </div>
            </main>
            
            <footer class="terminal-footer">
                <div class="footer-text">© 1987 CYBER SYSTEMS INC. ALL RIGHTS RESERVED</div>
                <div class="security-notice">UNAUTHORIZED ACCESS PROHIBITED</div>
            </footer>
        </div>
    </div>
    
    <script>
        // Form validation and interactions
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const clearButton = document.getElementById('clearButton');
            const successMessage = document.getElementById('successMessage');
            
            // Real-time validation
            function validateField(input) {
                const errorElement = document.getElementById(input.id + '-error');
                const value = input.value.trim();
                
                if (!value) {
                    errorElement.textContent = 'FIELD REQUIRED';
                    input.classList.add('error');
                    return false;
                } else if (input.id === 'username' && value.length < 3) {
                    errorElement.textContent = 'USERNAME TOO SHORT';
                    input.classList.add('error');
                    return false;
                } else if (input.id === 'password' && value.length < 6) {
                    errorElement.textContent = 'PASSWORD TOO WEAK';
                    input.classList.add('error');
                    return false;
                } else {
                    errorElement.textContent = '';
                    input.classList.remove('error');
                    return true;
                }
            }
            
            // Add event listeners
            usernameInput.addEventListener('input', () => validateField(usernameInput));
            passwordInput.addEventListener('input', () => validateField(passwordInput));
            
            usernameInput.addEventListener('blur', () => validateField(usernameInput));
            passwordInput.addEventListener('blur', () => validateField(passwordInput));
            
            // Form submission
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const isUsernameValid = validateField(usernameInput);
                const isPasswordValid = validateField(passwordInput);
                
                if (isUsernameValid && isPasswordValid) {
                    // Simulate login process
                    form.style.display = 'none';
                    successMessage.style.display = 'block';
                    
                    // Add typing animation to success message
                    setTimeout(() => {
                        successMessage.classList.add('show');
                    }, 100);
                }
            });
            
            // Clear button
            clearButton.addEventListener('click', function() {
                usernameInput.value = '';
                passwordInput.value = '';
                document.querySelectorAll('.error-message').forEach(el => el.textContent = '');
                document.querySelectorAll('.terminal-input').forEach(el => el.classList.remove('error'));
                usernameInput.focus();
            });
            
            // Focus management
            usernameInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    passwordInput.focus();
                }
            });
        });
    </script>
</body>
</html>
